services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI)
  # ============================================================================
  - type: web
    name: documind-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: APP_MODE
        value: demo
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

  # ============================================================================
  # 2. Frontend Static Site (React + Vite)
  # ============================================================================
  - type: static
    name: documind-ai-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://documind-ai-backend.onrender.com/api
